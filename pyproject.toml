[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-1c-mcp"
version = "0.1.0"
description = "Read-only MCP server for 1C:Enterprise standard OData (8.3.5+)"
readme = "README.pypi.md"
license = "MIT"
authors = [
    { name = "Artem Gulyaev", email = "serbianartek@gmail.com" },
]
requires-python = ">=3.10"
dependencies = [
    "python-1c-odata>=0.6.0",
    "mcp>=2.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
]
keywords = ["1c", "odata", "mcp", "1c-enterprise", "model-context-protocol"]

[project.urls]
Homepage = "https://github.com/itsuppartem/python_1c_mcp"
Repository = "https://github.com/itsuppartem/python_1c_mcp"
Issues = "https://github.com/itsuppartem/python_1c_mcp/issues"

[project.scripts]
python-1c-mcp = "python_1c_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "aiohttp>=3.9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
pretty = true
show_error_codes = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
